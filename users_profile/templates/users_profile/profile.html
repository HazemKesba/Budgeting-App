{% extends 'base.html' %}
{% block title %}User Profile{% endblock %}
{% block extra_css %}

<style>
    .profile-card {
        background: white;
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        border: 1px solid #e0e0e0;
    }
    .section-title {
        border-bottom: 2px solid #2980b9;
        color: #2c3e50;
        margin-bottom: 1.5rem;
        padding-bottom: 0.5rem;
        font-size: 1.25rem;
        font-weight: bold;
    }
    .form-group {
        margin-bottom: 1.2rem;
    }
    input[type="text"], input[type="email"], input[type="date"], textarea {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 1rem;
        transition: all 0.3s ease;
        margin-top: 5px;
    }
    input:focus, textarea:focus {
        border-color: #2980b9;
        outline: none;
        box-shadow: 0 0 8px rgba(41, 128, 185, 0.2);
    }
    label {
        display: block;
        margin-top: 10px;
        font-weight: 600;
        color: #444;
    }
    .btn-container {
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid #eee;
        display: flex;
        gap: 10px;
    }
</style>
{% endblock %}

{% block content %}
<div class="profile-card">
    <h2 style="margin-bottom: 1.5rem; color: #2c3e50; font-weight: bold;">Profile Information</h2>
    
    <form method="POST">
        {% csrf_token %}
        
        <div class="section-title">Account Details</div>
        <div class="form-group">
            {{ u_form.as_p }}
        </div>

        <div class="section-title" style="margin-top: 2rem;">Additional Info</div>
        <div class="form-group">
            {{ p_form.as_p }}
        </div>
        
        <div class="btn-container">
            <button type="submit" class="btn btn-primary">Update Profile</button>
            <a href="/" class="btn btn-secondary">Back to Home</a>
        </div>
    </form>
</div>
{% endblock %}
